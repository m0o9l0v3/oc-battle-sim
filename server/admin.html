<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>進行管理（親機）</title>
    <!-- 親機の管理画面（event-control.md §7）。表示する値は、サーバーが計算する（server/app.ts の /api/admin/status）。
         ここは、表示とボタンだけ。参加者ごとの作品・設定は、扱わない（§7.3） -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #10131a;
        color: #eef1f6;
        font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      .card {
        background: #171b26;
        border: 1px solid #2a3040;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .phase {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
      }
      .phase small {
        display: block;
        font-size: 13px;
        font-weight: normal;
        color: #b7c0d1;
      }
      .remaining {
        text-align: center;
        font-size: 40px;
        font-variant-numeric: tabular-nums;
        color: #7fd8c8;
        margin: 8px 0 12px;
      }
      .remaining.over {
        color: #ffb74d;
      }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 16px;
        font-size: 14px;
      }
      dt {
        color: #b7c0d1;
      }
      dd {
        margin: 0;
        font-weight: bold;
      }
      .ok {
        color: #4ce0b3;
      }
      .ng {
        color: #ff7043;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
      }
      button {
        font: inherit;
        font-size: 15px;
        padding: 12px 8px;
        border-radius: 6px;
        border: 1px solid #333a4d;
        background: #1d2231;
        color: #eef1f6;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #263049;
      }
      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      button.next {
        border-color: #4ce0b3;
        box-shadow: 0 0 0 2px #4ce0b355;
      }
      .rematch {
        margin-top: 8px;
      }
      #reset {
        width: 100%;
        background: #402028;
        border-color: #6b2b36;
      }
      #reset:hover:not(:disabled) {
        background: #522029;
      }
      .message {
        min-height: 20px;
        color: #ff7043;
        font-size: 14px;
      }
      .urls {
        font-size: 13px;
        color: #b7c0d1;
        word-break: break-all;
      }
      code {
        color: #eef1f6;
      }
      .label {
        text-align: center;
        font-size: 13px;
        color: #b7c0d1;
      }
      .phase-remaining {
        text-align: center;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        margin: 0 0 12px;
      }
      .phase-remaining.over {
        color: #ffb74d;
      }
      .adjust {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .plan {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 12px;
        margin-top: 12px;
        font-size: 14px;
      }
      .plan label {
        display: grid;
        gap: 4px;
        color: #b7c0d1;
      }
      .plan input {
        width: 5em;
        font: inherit;
        font-size: 16px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #333a4d;
        background: #10131a;
        color: #eef1f6;
      }
      .note {
        font-size: 13px;
        color: #b7c0d1;
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>進行管理（親機）</h1>
      <p>
        <a
          id="print-station"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          style="color: #7fd8c8"
          >印刷ステーション（持ち帰りカード）を開く</a
        >
      </p>
      <p class="message" id="message" role="alert"></p>

      <section class="card" aria-label="いまの進行">
        <div class="phase" id="phase">—<small id="phase-code"></small></div>
        <div class="label">ターンの残り</div>
        <div class="remaining" id="remaining" aria-label="ターンの残り時間">—</div>
        <div class="label" id="phase-remaining-label">いまのフェーズの残り</div>
        <div class="phase-remaining" id="phase-remaining" aria-labelledby="phase-remaining-label">
          —
        </div>
        <dl>
          <dt>ターンの開始</dt>
          <dd id="started">—</dd>
          <dt>終了予定</dt>
          <dd id="ends">—</dd>
          <dt>いまのフェーズの終了予定</dt>
          <dd id="phase-ends">—</dd>
          <dt>再戦の受付</dt>
          <dd id="rematch">—</dd>
          <dt>次の操作</dt>
          <dd id="next">—</dd>
          <dt>接続中の参加者PC</dt>
          <dd id="clients">—</dd>
          <dt>サーバー</dt>
          <dd id="server">—</dd>
        </dl>
      </section>

      <section class="card" aria-label="進行の操作">
        <div class="actions">
          <button type="button" data-command="START_PRODUCTION">制作開始</button>
          <button type="button" data-command="START_BATTLE">対戦開始</button>
          <button type="button" data-command="START_SHARING">持ち帰り開始</button>
          <button type="button" data-command="TO_BUFFER">予備時間へ</button>
          <button type="button" data-command="END">終了</button>
        </div>
        <div class="actions rematch">
          <button type="button" data-command="STOP_REMATCH">再戦を止める</button>
          <button type="button" data-command="OPEN_REMATCH">再戦を再開する</button>
        </div>
      </section>

      <section class="card" aria-label="時間の調整">
        <div class="label">いまのフェーズの時間を調整（ターンの終了予定も同じだけ動きます）</div>
        <div class="adjust" style="margin-top: 8px">
          <button type="button" data-delta="-300000">−5分</button>
          <button type="button" data-delta="-60000">−1分</button>
          <button type="button" data-delta="60000">＋1分</button>
          <button type="button" data-delta="300000">＋5分</button>
        </div>
        <form class="plan" id="plan">
          <label
            >制作（分）<input type="number" name="production" min="1" max="60" step="1" required
          /></label>
          <label
            >対戦（分）<input type="number" name="battle" min="1" max="60" step="1" required
          /></label>
          <label
            >持ち帰り（分）<input type="number" name="sharing" min="1" max="60" step="1" required
          /></label>
          <button type="submit" id="plan-save">予定を変更</button>
        </form>
        <p class="note">
          予定の変更は、いまのフェーズにもすぐ反映されます（開始からの長さとして計算）。次のターン以降も、この予定を使います。
        </p>
      </section>

      <section class="card" aria-label="一斉リセット">
        <button type="button" id="reset" data-command="RESET">
          一斉リセット（全台を S01 に戻す）
        </button>
      </section>

      <section class="card urls" aria-label="参加者PCの URL">
        <div>参加者PCで開く URL: <code id="urls">—</code></div>
        <div>個別リセット用ブックマーク: <code id="reset-urls">—</code></div>
      </section>
    </main>

    <script>
      'use strict'
      // トークンは URL に残す（管理画面を更新しても、開き直せるように）。親機PCの外からは、使えない
      const token = new URLSearchParams(location.search).get('token') || ''
      const $ = (id) => document.getElementById(id)
      $('print-station').href = `/print-station?token=${encodeURIComponent(token)}`
      const buttons = Array.from(document.querySelectorAll('button[data-command]'))
      const adjustButtons = Array.from(document.querySelectorAll('button[data-delta]'))
      const planForm = $('plan')
      const PLAN_KEYS = ['production', 'battle', 'sharing']
      const PHASE_TIMERS = {
        PRODUCTION: ['制作', 'production'],
        BATTLE: ['対戦', 'battle'],
        SHARING: ['持ち帰り', 'sharing'],
      }
      let busy = false
      let latest = null
      // 予定の入力中は、定期的な表示の更新で、入力を上書きしない
      let planEditing = false

      const clock = (ms) =>
        ms === null ? '—' : new Date(ms).toLocaleTimeString('ja-JP', { hour12: false })

      function render(s) {
        latest = s
        $('phase').firstChild.textContent = s.phaseLabel
        $('phase-code').textContent = s.phase
        $('remaining').textContent = s.remainingText
        $('remaining').classList.toggle('over', s.remainingMs !== null && s.remainingMs < 0)
        $('started').textContent = clock(s.turnStartedAt)
        $('ends').textContent = clock(s.turnEndsAt)
        $('phase-ends').textContent = clock(s.phaseEndsAt)
        const timer = PHASE_TIMERS[s.phase]
        $('phase-remaining-label').textContent = timer
          ? `${timer[0]}の残り（予定 ${s.plan[timer[1]] / 60000}分）`
          : 'いまのフェーズの残り'
        $('phase-remaining').textContent = s.phaseRemainingText
        $('phase-remaining').classList.toggle(
          'over',
          s.phaseRemainingMs !== null && s.phaseRemainingMs <= 0,
        )
        for (const b of adjustButtons) b.disabled = busy || !s.canAdjustTime
        $('plan-save').disabled = busy
        if (!planEditing) {
          for (const k of PLAN_KEYS) planForm.elements[k].value = String(s.plan[k] / 60000)
        }
        $('rematch').textContent = s.rematchOpen ? '受付中' : '停止中'
        $('rematch').className = s.rematchOpen ? 'ok' : 'ng'
        $('next').textContent = s.nextCommandLabel
        $('clients').textContent = `約 ${s.clients} 台`
        $('urls').textContent = s.participantUrls.join('  ') || '—'
        $('reset-urls').textContent = s.participantUrls.map((u) => u + '?reset').join('  ') || '—'
        for (const b of buttons) {
          const c = b.dataset.command
          b.disabled = busy || !s.commands[c]
          b.classList.toggle('next', c === s.nextCommand)
        }
        // 制作中の「持ち帰り開始」は、対戦を飛ばす（予定の時間までに終わらないとき。§7.5）
        document.querySelector('[data-command="START_SHARING"]').textContent =
          s.phase === 'PRODUCTION' ? '持ち帰り開始（対戦を飛ばす）' : '持ち帰り開始'
      }

      function setServer(ok) {
        $('server').textContent = ok ? '稼働中' : '応答なし'
        $('server').className = ok ? 'ok' : 'ng'
      }

      async function api(path, init) {
        const res = await fetch(path, {
          cache: 'no-store',
          ...init,
          headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        })
        const body = await res.json().catch(() => null)
        return { res, body }
      }

      async function poll() {
        try {
          const { res, body } = await api('/api/admin/status')
          if (res.status === 401 || res.status === 403) {
            $('message').textContent =
              '管理画面のトークンが違います。サーバーを起動したときに表示された URL を開き直してください（再起動するとトークンが変わります）。'
            setServer(true)
            return
          }
          if (!res.ok || !body) throw new Error()
          setServer(true)
          render(body)
        } catch {
          setServer(false)
        }
      }

      async function send(command, extra) {
        if (command === 'RESET') {
          const ok = confirm(
            '一斉リセットします。全台の参加者PCが、S01（はじめ）に戻り、いまの組のデータは消えます。よろしいですか？',
          )
          if (!ok) return
        }
        // 通常の進行は確認しないが、対戦を飛ばすときだけ確認する
        if (command === 'START_SHARING' && latest && latest.phase === 'PRODUCTION') {
          const ok = confirm(
            '対戦の時間を飛ばして、持ち帰りに進みます。参加者PCは、設定の変更や新しい対戦ができなくなります（いま対戦中の組は、終わるまで続けられます）。よろしいですか？',
          )
          if (!ok) return
        }
        busy = true
        if (latest) render(latest)
        $('message').textContent = ''
        try {
          const { res, body } = await api('/api/admin/command', {
            method: 'POST',
            body: JSON.stringify({ command, ...extra }),
          })
          if (res.status === 409)
            $('message').textContent = 'いまのフェーズでは、この操作はできません。'
          else if (res.status === 400)
            $('message').textContent = '入力が正しくありません（予定は 1〜60 分の整数）。'
          else if (!res.ok) $('message').textContent = `操作に失敗しました（${res.status}）`
          if (body && body.phase) render(body)
        } catch {
          $('message').textContent =
            'サーバーに接続できません。親機のサーバーが動いているか確かめてください。'
        } finally {
          busy = false
          if (latest) render(latest)
        }
      }

      for (const b of buttons) b.addEventListener('click', () => send(b.dataset.command))
      for (const b of adjustButtons)
        b.addEventListener('click', () => send('ADJUST_TIME', { deltaMs: Number(b.dataset.delta) }))
      planForm.addEventListener('focusin', () => (planEditing = true))
      planForm.addEventListener('focusout', (e) => {
        if (!planForm.contains(e.relatedTarget)) planEditing = false
      })
      planForm.addEventListener('submit', async (e) => {
        e.preventDefault()
        const plan = {}
        for (const k of PLAN_KEYS) plan[k] = Math.round(Number(planForm.elements[k].value) * 60000)
        planEditing = false
        await send('SET_PLAN', { plan })
      })
      poll()
      setInterval(poll, 1000)
    </script>
  </body>
</html>
